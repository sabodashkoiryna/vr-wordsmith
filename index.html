<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0818" />

    <!-- Шрифти self-hosted (див. scripts/fetch-fonts.mjs) — жодного
         рендер-блокуючого запиту на fonts.googleapis.com. Преловантажуємо
         рівно два накреслення, потрібні над згином українською:
         заголовок (Unbounded 800) і основний текст (Plex Sans 400). -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/unbounded-800-cyrillic.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/plex-sans-400-cyrillic.woff2" />

    <title>VR-Словесник — платформа підготовки майбутніх учителів</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
